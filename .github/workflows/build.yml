name: Build Baseball Draw

# Builds the Windows (and Linux) game from source, runs the automated tests,
# uploads the playable builds as workflow artifacts, and smoke-tests both exports
# (the Windows one on a windows-latest runner).
# Runs on demand (Actions tab -> "Build Baseball Draw" -> Run workflow), on version
# tags (v*), on pushes to main, and on any push whose commit message contains "[build]".
on:
  workflow_dispatch:
  push:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash   # explicit shell = "bash -eo pipefail", so piped test output keeps failures
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q -j templates.tpz "templates/windows_release_x86_64.exe" "templates/windows_release_x86_64_console.exe" \
            "templates/linux_release.x86_64" "templates/version.txt" \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm templates.tpz godot.zip

      - name: Import project
        run: godot --headless --path . --import || true

      # Each test exits non-zero on failure (pipefail carries it through tee);
      # the autopilot game must reach the results screen. A summary goes on the run page.
      - name: Run automated tests
        run: |
          godot --headless --path . res://tests/check_all.tscn 2>&1 | tee check.log
          godot --headless --path . res://tests/test_suite.tscn -- --profile=ci --fresh-profile 2>&1 | tee suite.log
          godot --headless --path . --fixed-fps 30 -- --test-battle=quick --auto --profile=ci_sim --fresh-profile 2>&1 | tee sim.log
          {
            echo "### Automated tests"
            echo '```'
            grep -h "CHECKED" check.log
            grep -h "checks, " suite.log
            grep -h "FINISHED" sim.log || echo "autopilot game did not finish"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q "FINISHED" sim.log

      - name: Export Windows and Linux builds
        run: |
          mkdir -p build/windows build/linux
          godot --headless --path . --export-release "Windows Desktop" build/windows/BaseballDraw.exe > export_windows.log 2>&1 || { tail -40 export_windows.log; exit 1; }
          godot --headless --path . --export-release "Linux" build/linux/BaseballDraw.x86_64 > export_linux.log 2>&1 || { tail -40 export_linux.log; exit 1; }
          test -s build/windows/BaseballDraw.pck && test -s build/linux/BaseballDraw.pck
          ls -la build/windows build/linux

      # The exported Linux binary plays a short autopilot game, saves and reloads (see src/core/smoke_test.gd).
      - name: Smoke test the Linux export
        run: |
          timeout 600 build/linux/BaseballDraw.x86_64 --headless -- --smoke-test 2>&1 | tee smoke_linux.log
          grep -h "SMOKE TEST" smoke_linux.log >> "$GITHUB_STEP_SUMMARY"
          grep -q "SMOKE TEST: PASS" smoke_linux.log

      - name: Add the README
        run: cp README.md build/windows/ && cp README.md build/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: BaseballDraw-Windows
          path: build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: BaseballDraw-Linux
          path: build/linux/

  # Runs the exported Windows game on a real Windows machine: main menu, a Quick Defense autopilot game
  # at 4x speed, rewards, save and reload. Headless, so no GPU is needed; it fails the build on any error.
  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BaseballDraw-Windows
          path: game

      - name: Smoke test BaseballDraw.exe
        run: |
          cd game
          ls -la
          # The .exe is a GUI program: its output goes to the log file, the exit code tells the result.
          log="$(cygpath -w "$PWD/smoke.log")"
          set +e
          timeout 600 ./BaseballDraw.exe --headless --log-file "$log" -- --smoke-test > stdout.log 2>&1
          code=$?
          set -e
          cat stdout.log smoke.log 2>/dev/null || true
          {
            echo "### Windows smoke test"
            echo '```'
            grep -h "SMOKE" smoke.log stdout.log 2>/dev/null || echo "no smoke-test output (exit code $code)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit code: $code"
          test "$code" -eq 0
          cat smoke.log stdout.log 2>/dev/null | grep -q "SMOKE TEST: PASS"
