name: Build Baseball Draw

# Builds the Windows (and Linux) game from source, runs the automated tests,
# and uploads the playable builds as workflow artifacts.
# Runs on demand (Actions tab -> "Build Baseball Draw" -> Run workflow), on version
# tags (v*), on pushes to main, and on any push whose commit message contains "[build]".
on:
  workflow_dispatch:
  push:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q -j templates.tpz "templates/windows_release_x86_64.exe" "templates/windows_release_x86_64_console.exe" \
            "templates/linux_release.x86_64" "templates/version.txt" \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm templates.tpz godot.zip

      - name: Import project
        run: godot --headless --path . --import || true

      # Each test exits non-zero on failure (the default shell runs with pipefail);
      # the autopilot game must reach the results screen. A summary goes on the run page.
      - name: Run automated tests
        run: |
          godot --headless --path . res://tests/check_all.tscn 2>&1 | tee check.log
          godot --headless --path . res://tests/test_suite.tscn -- --profile=ci --fresh-profile 2>&1 | tee suite.log
          godot --headless --path . --fixed-fps 30 -- --test-battle=quick --auto --profile=ci_sim --fresh-profile 2>&1 | tee sim.log
          {
            echo "### Automated tests"
            echo '```'
            grep -h "CHECKED" check.log
            grep -h "checks, " suite.log
            grep -h "FINISHED" sim.log || echo "autopilot game did not finish"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q "FINISHED" sim.log

      - name: Export Windows and Linux builds
        run: |
          mkdir -p build/windows build/linux
          godot --headless --path . --export-release "Windows Desktop" build/windows/BaseballDraw.exe > export_windows.log 2>&1 || { tail -40 export_windows.log; exit 1; }
          godot --headless --path . --export-release "Linux" build/linux/BaseballDraw.x86_64 > export_linux.log 2>&1 || { tail -40 export_linux.log; exit 1; }
          test -s build/windows/BaseballDraw.pck && test -s build/linux/BaseballDraw.pck
          ls -la build/windows build/linux
          cp README.md build/windows/ && cp README.md build/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: BaseballDraw-Windows
          path: build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: BaseballDraw-Linux
          path: build/linux/
